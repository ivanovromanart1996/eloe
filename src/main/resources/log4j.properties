log4j.rootLogger=INFO, stdout, file

log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.conversionPattern=%d %5p %t %c{1}:%M:%L - %m%n

log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.file=log/EloE_desktop.log
log4j.appender.file.MaxFileSize=5MB
log4j.appender.file.MaxBackupIndex=2
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.conversionPattern=%d %5p %t %c{1}:%M:%L - %m%n

log4j.appender.secondfile=org.apache.log4j.RollingFileAppender
log4j.appender.secondfile.file=log/EEIEngine.log
log4j.appender.secondfile.MaxFileSize=1MB
log4j.appender.secondfile.MaxBackupIndex=2
log4j.appender.secondfile.layout=org.apache.log4j.PatternLayout
log4j.appender.secondfile.layout.conversionPattern=%d %5p %t %c{1}:%M:%L - %m%n

log4j.appender.thirdfile=org.apache.log4j.RollingFileAppender
log4j.appender.thirdfile.file=log/Time.log
log4j.appender.thirdfile.MaxFileSize=1MB
log4j.appender.thirdfile.MaxBackupIndex=2
log4j.appender.thirdfile.layout=org.apache.log4j.PatternLayout
log4j.appender.thirdfile.layout.conversionPattern=%d %5p %t %c{1}:%M:%L - %m%n

log4j.logger.org.eloe.engine.EEIEngine=INFO, secondfile, thirdfile
log4j.logger.org.eloe.engine.EEI_Counter=INFO, secondfile
log4j.logger.org.eloe.engine.Processing=INFO, secondfile
log4j.logger.org.eloe.engine.Auxiliary_Class=INFO, thirdfile
log4j.logger.org.eloe.organism.OrganismBuilder=INFO, secondfile